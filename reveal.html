<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who Gifts Who</title>
  <meta name="description" content="Who Gifts Who (WGW): your secret Secret Santa result.">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#b3243b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/reveal.js"></script>
</head>
<body class="reveal-page">
  <header class="app-header">
    <a class="brand" href="./">
      <span class="logo" aria-hidden="true">WGW</span>
      <span class="brand-title">Who Gifts Who</span>
    </a>
    <div class="lang-switch" role="group" data-i18n-aria="app.language">
      <button type="button" class="lang-btn" data-lang="es" lang="es">ES</button>
      <button type="button" class="lang-btn" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <main id="main" class="container reveal-main">
    <div id="reveal-error" class="card reveal-card" hidden>
      <p class="stage-icon" aria-hidden="true">🔒</p>
      <h1 data-i18n="reveal.errorTitle">Enlace no válido</h1>
      <p data-i18n="reveal.errorText">Este enlace está incompleto o dañado. Pide a quien organiza el sorteo que te lo vuelva a enviar.</p>
    </div>

    <div id="reveal-ready" class="card reveal-card">
      <h1 class="hello"><span data-i18n="reveal.hello">Hola,</span> <span id="giver-name" class="giver-name">…</span></h1>

      <svg class="gift" id="gift" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="gift-glow" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#f2c14e" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <ellipse class="gift-shadow" cx="100" cy="186" rx="62" ry="7"/>
        <g class="gift-glow">
          <polygon points="58,104 142,104 176,18 24,18"/>
        </g>
        <g class="gift-sparkles">
          <path class="spark s1" d="M60 52 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
          <path class="spark s2" d="M138 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
          <path class="spark s3" d="M100 22 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
          <circle class="spark s4" cx="80" cy="30" r="3"/>
          <circle class="spark s5" cx="124" cy="70" r="3"/>
        </g>
        <g class="gift-body">
          <rect class="gift-inside" x="44" y="100" width="112" height="12" rx="2"/>
          <rect class="gift-box" x="44" y="104" width="112" height="78" rx="8"/>
          <rect class="gift-shade" x="44" y="104" width="112" height="10"/>
          <rect class="gift-ribbon" x="92" y="104" width="16" height="78"/>
        </g>
        <g class="gift-lid">
          <rect class="gift-lid-top" x="36" y="80" width="128" height="26" rx="6"/>
          <rect class="gift-ribbon" x="92" y="80" width="16" height="26"/>
          <path class="gift-bow" d="M100 80 C 78 50, 52 62, 66 76 C 72 82, 88 82, 100 80 Z"/>
          <path class="gift-bow" d="M100 80 C 122 50, 148 62, 134 76 C 128 82, 112 82, 100 80 Z"/>
          <path class="gift-bow-tail" d="M98 82 L 86 98 L 92 99 Z M102 82 L 114 98 L 108 99 Z"/>
          <circle class="gift-knot" cx="100" cy="80" r="7"/>
        </g>
      </svg>

      <!-- Both layers share one grid cell, so swapping them never changes the card's height. -->
      <div class="reveal-stage">
        <div id="reveal-before" class="reveal-layer">
          <p id="reveal-intro" data-i18n="reveal.intro">Tu amigo invisible te espera dentro de este regalo.</p>
          <button type="button" id="reveal-btn" class="btn btn-primary btn-large" disabled><span class="icon" aria-hidden="true">🎁</span> <span data-i18n="reveal.button">Descubrir a quién le regalo</span></button>
        </div>
        <div id="reveal-result" class="reveal-layer is-hidden" aria-live="polite">
          <p class="eyebrow" data-i18n="reveal.youGift">Le regalas a…</p>
          <p id="receiver-name" class="big-name" tabindex="-1"></p>
          <p class="hint" data-i18n="reveal.keepSecret">¡Shhh! Guarda el secreto 🤫</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer container">
    <p><a href="./" data-i18n="reveal.createOwn">Organiza tu propio amigo invisible con Who Gifts Who</a></p>
  </footer>
</body>
</html>
