<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who Gifts Who</title>
  <meta name="description" content="Who Gifts Who (WGW): your secret Secret Santa result.">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#b3243b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/reveal.js"></script>
</head>
<body class="reveal-page">
  <header class="app-header">
    <a class="brand" href="./">
      <span class="logo" aria-hidden="true">WGW</span>
      <span class="brand-title">Who Gifts Who</span>
    </a>
    <div class="lang-switch" role="group" data-i18n-aria="app.language">
      <button type="button" class="lang-btn" data-lang="es" lang="es">ES</button>
      <button type="button" class="lang-btn" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <main id="main" class="container reveal-main">
    <div id="reveal-loading" class="card reveal-card">
      <p data-i18n="reveal.loading">Abriendo tu enlace…</p>
    </div>

    <div id="reveal-error" class="card reveal-card" hidden>
      <h1 data-i18n="reveal.errorTitle">Enlace no válido</h1>
      <p data-i18n="reveal.errorText"></p>
    </div>

    <div id="reveal-ready" class="card reveal-card" hidden>
      <h1 class="hello"><span data-i18n="reveal.hello">Hola,</span> <span id="giver-name"></span></h1>
      <p id="reveal-intro" data-i18n="reveal.intro"></p>

      <div class="gift" id="gift" aria-hidden="true">
        <div class="gift-lid"><span class="gift-bow"></span></div>
        <div class="gift-box"></div>
      </div>

      <button type="button" id="reveal-btn" class="btn btn-primary btn-large" data-i18n="reveal.button">Descubrir a quién le regalo</button>

      <div id="reveal-result" class="reveal-result" hidden>
        <p class="eyebrow" data-i18n="reveal.youGift">Le regalas a…</p>
        <p id="receiver-name" class="big-name reveal-pop" tabindex="-1"></p>
        <p class="hint" data-i18n="reveal.keepSecret"></p>
      </div>
    </div>
  </main>

  <footer class="app-footer container">
    <p><a href="./" data-i18n="reveal.createOwn">Organiza tu propio amigo invisible con Who Gifts Who</a></p>
  </footer>
</body>
</html>
